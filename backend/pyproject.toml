[project]
name = "bonemap-backend"
version = "0.1.0"
description = "BONE-MAP: Bone Architecture Quantification & Fracture Recovery Monitoring API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.4,<2.3",
    "scipy>=1.14.0",
    "scikit-image>=0.24.0",
    "SimpleITK>=2.4.0",
    "pydicom>=3.0.1",
    "nibabel>=5.3.0",
    "pyvista>=0.44.0",
    "trimesh>=4.5.0",
    "pillow>=11.0.0",
    "httpx>=0.27.2",
]

[tool.uv]
package = false
